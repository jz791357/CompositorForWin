name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'
            code:
              - 'src/**'
              - 'scripts/**'
              - '.github/**'
              - 'CompositorForWin.sln'
      - id: decide
        # Docs-only when documentation changed and nothing outside it did.
        run: echo "docs_only=${{ steps.filter.outputs.docs == 'true' && steps.filter.outputs.code != 'true' }}" >> "$GITHUB_OUTPUT"

  build-test:
    needs: changes
    # Documentation-only changes skip the build by policy (docs/TESTING.md):
    # they are gated by correctness review, not CI. The job still runs so the
    # required "build-test" check resolves green for such PRs.
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 30
    steps:
      - name: Docs-only fast lane
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change — build and tests skipped by policy."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: microsoft/setup-msbuild@v2
        if: needs.changes.outputs.docs_only != 'true'

      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build native kernels (msbuild)
        if: needs.changes.outputs.docs_only != 'true'
        run: msbuild src/Compositor.Native/Compositor.Native.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Build & test (TRX + coverage)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          dotnet build src/Compositor.Tests/Compositor.Tests.csproj -c Release
          dotnet test src/Compositor.Tests/Compositor.Tests.csproj -c Release --no-build --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test results & coverage
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            src/Compositor.Tests/TestResults/**/*.trx
            src/Compositor.Tests/TestResults/**/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publish app
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          dotnet publish src/Compositor/Compositor.csproj -c Release -r win-x64 --self-contained false -o publish
          Copy-Item src/Compositor.Native/out/Compositor.Native.dll publish/

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: Compositor-win-x64
          path: publish/
